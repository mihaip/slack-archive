{{define "title"}}Archive for {{.Conversation.Name}}{{end}}

{{define "body"}}

<form method="GET" action="{{routeUrl "conversation-archive" "type" .ConversationType "ref" .ConversationRef}}">
  <label for="archive-date">Archive date</label>
  <input type="date" id="archive-date" name="date" value="{{.ArchiveDate}}" max="{{.DefaultArchiveDate}}">
  <input type="submit" class="action-button" value="View Date">
</form>

<form method="POST" action="{{routeUrl "send-conversation-archive"}}">
  <input type="hidden" name="conversation_type" value="{{.ConversationType}}">
  <input type="hidden" name="conversation_ref" value="{{.ConversationRef}}">
  <input type="hidden" name="date" value="{{.ArchiveDate}}">
  <input type="hidden" name="idempotency_key" value="{{.ConversationSendIdempotencyKey}}">
  <input type="submit" class="action-button" value="Send Mail">
</form>

{{template "conversation-archive" .ConversationArchive}}

{{end}}
